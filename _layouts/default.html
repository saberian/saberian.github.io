<!doctype html>
<html lang="en">
  {% include head.html %}
  <body class="{% if page.home %}home-page{% else %}reading-page{% endif %}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
      <nav aria-label="Main navigation">
        {% unless page.home %}<a href="{{ '/#writing' | relative_url }}">Writing</a>{% endunless %}
        <a href="{{ site.data.profile.linkedin }}">LinkedIn</a>
      </nav>
    </header>
    <main id="main-content">{{ content }}</main>
  </body>
</html>
