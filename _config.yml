title: Ehsan Saberian
description: Notes on AI, experiments, and things I’m learning.
url: "https://saberian.github.io"
baseurl: ""

permalink: /blog/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax

exclude:
  - vendor
  - node_modules
  - tests
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - PRODUCT.md
  - DESIGN.md
  - README.md
  - .impeccable
